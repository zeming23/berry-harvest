name: berry-harvest
# BerryHub 公益节点每日自动收割: 侦察→下载视频→OCR密码→解锁→拉订阅→测活→邮件投递
# 北京时间每天 20:05 (UTC 12:05) 触发; 帖子 20:00 发布, 有效期 28h
on:
  schedule:
    - cron: '5 12 * * *'   # 北京 20:05; macOS 真机首次接触已验证通过(6s+wp-json 200)
                             # ⚠️ 雷池按频率限流: 每天仅此一次访问, 失败靠次日重试, 勿手动加跑
  workflow_dispatch:
    inputs:
      test:
        description: '测试模式(不发邮件)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  harvest:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install --quiet playwright rapidocr-onnxruntime yt-dlp
          npm install electron@44.7.0 --no-audit --no-fund
          # 二进制可能被 npm 静默跳过, 显式补下载并强制校验
          test -d node_modules/electron/dist/Electron.app || node node_modules/electron/install.js
          test -d node_modules/electron/dist/Electron.app || { echo "!! electron binary missing"; exit 1; }
          echo "electron macOS OK"
          ffmpeg -version >/dev/null 2>&1 || brew install ffmpeg

      - name: Start WARP (IP rotation, protects pool reputation)
        run: |
          brew install --cask cloudflare-warp 2>&1 | tail -2 || echo "(cask 安装失败, 直连模式)"
          sleep 6
          WCLI="/Applications/Cloudflare WARP.app/Contents/MacOS/warp-cli"
          [ -x "$WCLI" ] || WCLI="$(which warp-cli 2>/dev/null || echo /Applications/Cloudflare\ WARP.app/Contents/Resources/warp-cli)"
          echo "warp-cli: $WCLI"
          "$WCLI" --accept-tos registration new 2>&1 | tail -1 || "$WCLI" --accept-tos register 2>&1 | tail -1 || true
          "$WCLI" --accept-tos mode proxy 2>&1 | tail -1 || true
          "$WCLI" --accept-tos connect 2>&1 | tail -1 || true
          sleep 6
          "$WCLI" --accept-tos status 2>&1 | tail -1 || true
          WIP=$(curl -s --max-time 15 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org) && echo "WARP egress IP: $WIP" || echo "(WARP 未就绪, 将直连)"

      - name: Log outbound IP (diagnosis, not berryhub)
        run: curl -s --max-time 10 https://api.ipify.org && echo

      - name: Run harvest
        env:
          MAIL_AUTHCODE: ${{ secrets.MAIL_AUTHCODE }}
          MAIL_TO: '1460590568@qq.com'
          BARK_KEY: ${{ secrets.BARK_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          TEST_MODE: ${{ github.event.inputs.test }}
          ELECTRON_NO_SPOOF: '1'
          ELECTRON_CDP_PORT: '9223'
        run: |
          python berry_auto_mail.py 2>&1 | tee harvest_run.log
          exit ${PIPESTATUS[0]}

      - name: Commit state (keep workflow alive)
        if: always()
        run: |
          git config user.name "berry-bot"
          git config user.email "719794448@qq.com"
          mkdir -p state
          echo "harvest $(date -u '+%F %T') exit=$?" >> state/heartbeat.txt
          tail -20 state/heartbeat.txt > state/heartbeat.tmp && mv state/heartbeat.tmp state/heartbeat.txt
          git add state/
          git diff --cached --quiet || git commit -m "state update $(date -u '+%F')"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }} || echo "(push跳过)"
